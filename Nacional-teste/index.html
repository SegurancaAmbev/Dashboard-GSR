<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard GSR</title><script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script><style>body{margin:0;background:#ececec;font-family:Segoe UI,sans-serif}.header{background:#121212;color:#fff;padding:28px;text-align:center;border-bottom:6px solid #D4A017}.container{padding:24px;max-width:1500px;margin:auto}.upload{text-align:center;padding:20px}.filebtn{background:#D4A017;border:0;padding:14px 24px;border-radius:25px;font-weight:700;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}.card{background:#121212;border-radius:18px;padding:20px;color:#fff;text-align:center}.num{color:#D4A017;font-size:30px;font-weight:800}.panel{background:#fff;border-radius:18px;padding:20px;margin-top:20px}table{width:100%;border-collapse:collapse}th{background:#121212;color:#fff}th,td{text-align:center;padding:12px}tr:nth-child(even){background:#f7f7f7}.filters{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}.btn{background:#D0D0D0;border:0;padding:10px 16px;border-radius:22px;cursor:pointer}.active{background:#D4A017}.bar{height:16px;background:#ddd;border-radius:10px}.fill{height:100%;background:#D4A017}.gold{background:#D4A01722}.silver{background:#D0D0D055}.bronze{background:#c47a2c22}</style></head><body><div class='header'><h1>Dashboard Executivo GSR</h1><div id='ultimaAtualizacao' style='font-size:14px;color:#D4A017;margin-top:8px;'></div></div><div class='container'><div class='upload'><b>✅ Base carregada automaticamente</b></div><div class='cards'><div class='card'><div>Total GSR</div><div class='num' id='k1'>-</div></div><div class='card'><div>Realizados</div><div class='num' id='k2'>-</div></div><div class='card'><div>Vencidos</div><div class='num' id='k5'>-</div></div><div class='card'><div>Aderência Geral</div><div class='num' id='k3'>-</div></div><div class='card'><div>Top Unidade</div><div class='num' style='font-size:18px' id='k4'>-</div></div></div><div class='panel'><h3>Regional</h3><div class='filters' id='regionalFilters'></div><div id='unitArea' style='display:none;margin-top:20px;'><h3>Unidade</h3><div class='filters' id='unitFilters'></div></div></div><div class='panel'><h2>Colaboradores por Unidade</h2><div style='margin-bottom:15px;display:flex;gap:10px;flex-wrap:wrap'><select id='gestorFiltro' style='padding:8px;width:300px;border-radius:6px'><option value=''>Todos os gestores</option></select><select id='colaboradorFiltro' style='padding:8px;width:300px;border-radius:6px'><option value=''>Todos os colaboradores</option></select></div><table><thead><tr><th>ID</th><th>Nome</th><th>Gestor</th><th>Data Último GSR</th><th>Modal</th><th>Intervalo</th></tr></thead><tbody id='tb1'></tbody></table></div><div class='panel'><h2>Ranking de Aderência</h2><div style='margin-bottom:15px'><label style='font-weight:600;margin-right:10px'>Mês:</label><div id='mesDropdown' style='position:relative;width:300px;margin-top:10px'><button type='button' id='mesDropdownBtn' style='width:300px;padding:8px 12px;border:1px solid #767676;border-radius:6px;background:#fff;text-align:left;cursor:pointer;font-family:inherit;font-size:14px;display:flex;justify-content:space-between;align-items:center'><span id='mesDropdownTexto'>Todos os meses</span><span style='font-size:12px'>▼</span></button><div id='mesFiltroRanking' style='display:none;position:absolute;top:100%;left:0;width:300px;max-height:260px;overflow-y:auto;background:#fff;border:1px solid #aaa;border-radius:6px;margin-top:4px;padding:6px 0;box-shadow:0 4px 12px rgba(0,0,0,.18);z-index:1000'></div></div></div><table><thead><tr><th>#</th><th>Unidade</th><th>Realizados</th><th>Total</th><th>% Realizados</th><th>Aderência</th></tr></thead><tbody id='tb2'></tbody></table></div></div><script>document.addEventListener('DOMContentLoaded',()=>{document.getElementById('ultimaAtualizacao').textContent='Última atualização: '+new Date(document.lastModified).toLocaleString('pt-BR');});const excl=['Com CD Agudos - AS','Com CD Campinas - AS','Com CD Capital - AS','Com CD R. Preto - AS','ComCDD PraiaGrd - AS','ComCDD SJCampos - AS'];Papa.parse('Base GSR Nacional.csv',{download:true,header:true,skipEmptyLines:true,complete:r=>load(r.data)});function load(data){console.log(Object.keys(data[0]));const c=Object.keys(data[0]),REG=c[0],U=c[16],ID=c[2],NM=c[17],INT=c[12],CL=c[13],MD=c[15],GESTOR='Gestor Corrigido',DATA_GSR='Data Último GSR';const rows=data.filter(x=>!excl.includes(String(x[U]).trim()) && String(x[U]).trim()!='NA' && String(x[U]).trim()!='');const rowsValidos=rows.filter(x=>String(x[CL]).trim()!=='-'),total=rowsValidos.length,real=rowsValidos.filter(x=>String(x[CL]).toUpperCase().includes('REALIZ')).length,venc=rowsValidos.filter(x=>String(x[CL]).toUpperCase().includes('VENC')).length;k1.textContent=total;k2.textContent=real;k3.textContent=Math.round((real/total)*100)+'%';k5.textContent=venc;let emp={},rank={};rows.forEach(r=>{let ek=[r[U],r[ID],r[NM],r[GESTOR],r[DATA_GSR],r[MD]].join('|');if(String(r[INT]).trim()==='-'||String(r[CL]).trim()==='-'){emp[ek]='-';}else if(emp[ek]!=='-'){emp[ek]=(emp[ek]||0)+(+r[INT]||0);}if(!rank[r[U]])rank[r[U]]={Regional:r[REG],Unidade:r[U],Realizados:0,Total:0};if(String(r[CL]).trim()!=='-'){rank[r[U]].Total++;if(String(r[CL]).toUpperCase().includes('REALIZ'))rank[r[U]].Realizados++;}});const empArrCompleto=Object.entries(emp).map(([k,v])=>{let p=k.split('|');return{Unidade:p[0],ID:p[1],Nome:p[2],Gestor:p[3],DataUltimoGSR:p[4],Modal:p[5],Intervalo:v};});function converterDataGSR(valor){if(!valor)return new Date(0);const s=String(valor).trim();const br=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(br){return new Date(Number(br[3]),Number(br[2])-1,Number(br[1]));}const iso=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(iso){return new Date(Number(iso[1]),Number(iso[2])-1,Number(iso[3]));}const d=new Date(s);return isNaN(d.getTime())?new Date(0):d;}const maisRecentes=new Map();empArrCompleto.forEach(x=>{const identificador=String(x.ID||'').trim()||String(x.Nome||'').trim();const chave=[String(x.Unidade||'').trim(),identificador,String(x.Modal||'').trim()].join('|');const existente=maisRecentes.get(chave);if(!existente||converterDataGSR(x.DataUltimoGSR)>converterDataGSR(existente.DataUltimoGSR)){maisRecentes.set(chave,x);}});const empArr=[...maisRecentes.values()];const rk=Object.values(rank).map(x=>({...x,Percentual:x.Total>0?+((x.Realizados/x.Total)*100).toFixed(2):0})).sort((a,b)=>b.Percentual-a.Percentual||b.Realizados-a.Realizados);const nomesMeses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];function obterMes(valor){const d=converterDataGSR(valor);return d.getTime()===0?null:d.getMonth();}const mesesDisponiveis=[...new Set(rows.map(x=>obterMes(x[DATA_GSR])).filter(x=>x!==null))].sort((a,b)=>a-b);const mesFiltroRanking=document.getElementById('mesFiltroRanking');mesFiltroRanking.innerHTML=mesesDisponiveis.map(m=>`<label style="display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;background:#fff"><input type="checkbox" value="${m}" checked>${nomesMeses[m]}</label>`).join('');function obterRankingFiltrado(){const meses=[...mesFiltroRanking.querySelectorAll('input[type="checkbox"\]:checked')].map(o=>Number(o.value));const dados=rows.filter(x=>(atual===''||String(x[REG]).trim()===String(atual).trim())&&(meses.length===0||meses.includes(obterMes(x[DATA_GSR]))));const agrupado={};dados.forEach(r=>{const unidade=String(r[U]||'').trim();const classificacao=String(r[CL]||'').trim();if(!unidade||unidade==='NA'||unidade.toUpperCase()==='AS'||classificacao==='-')return;if(!agrupado[unidade])agrupado[unidade]={Regional:r[REG],Unidade:unidade,Realizados:0,Total:0};agrupado[unidade].Total++;if(classificacao.toUpperCase().includes('REALIZ'))agrupado[unidade].Realizados++;});return Object.values(agrupado).map(x=>({...x,Percentual:x.Total>0?(x.Realizados/x.Total)*100:0})).sort((a,b)=>b.Percentual-a.Percentual||b.Realizados-a.Realizados);}function renderRanking(){const rankingFiltrado=obterRankingFiltrado();tb2.innerHTML=rankingFiltrado.map((r,i)=>`<tr class='${i===0?'gold':i===1?'silver':i===2?'bronze':''}'><td>${i+1}</td><td>${r.Unidade}</td><td>${r.Realizados}</td><td>${r.Total}</td><td>${Math.round(r.Percentual)}%</td><td><div class='bar'><div class='fill' style='width:${r.Percentual}%'></div></div></td></tr>`).join('');}const mesDropdownBtn=document.getElementById('mesDropdownBtn'),mesDropdownTexto=document.getElementById('mesDropdownTexto');mesDropdownBtn.onclick=e=>{e.stopPropagation();mesFiltroRanking.style.display=mesFiltroRanking.style.display==='block'?'none':'block';};mesFiltroRanking.addEventListener('click',e=>e.stopPropagation());mesFiltroRanking.addEventListener('change',()=>{const selecionados=[...mesFiltroRanking.querySelectorAll('input[type="checkbox"\]:checked')];mesDropdownTexto.textContent=selecionados.length===mesesDisponiveis.length?'Todos os meses':selecionados.length===0?'Nenhum mês':selecionados.map(x=>nomesMeses[Number(x.value)]).join(', ');renderRanking();});document.addEventListener('click',()=>mesFiltroRanking.style.display='none');k4.textContent=rk[0]?.Unidade||'-';function atualizarCards(dados,topUnidade=null){const dadosValidos=dados.filter(x=>String(x[CL]).trim()!=='-');const total=dadosValidos.length;const realizados=dadosValidos.filter(x=>String(x[CL]).toUpperCase().includes('REALIZ')).length;const vencidos=dadosValidos.filter(x=>String(x[CL]).toUpperCase().includes('VENC')).length;const aderencia=total>0?Math.round((realizados/total)*100):0;k1.textContent=total;k2.textContent=realizados;k5.textContent=vencidos;k3.textContent=aderencia+'%';if(topUnidade!==null)k4.textContent=topUnidade;}const regionais=[...new Set(rows.map(x=>String(x[REG]||'').trim()).filter(r=>r && r!=='-' && r!=='NA'))].sort();document.getElementById('regionalFilters').innerHTML='';let atual='';regionais.forEach(r=>{let b=document.createElement('button');b.className='btn';b.textContent=r;b.onclick=()=>{atual=r;document.querySelectorAll('#regionalFilters .btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');const dadosRegional=rows.filter(x=>x[REG]===atual);const topRegional=rk.filter(x=>x.Regional===atual)[0]?.Unidade||'-';atualizarCards(dadosRegional,topRegional);document.getElementById('unitArea').style.display='block';const unidades=[...new Set(rows.filter(x=>x[REG]===atual).map(x=>x[U]))].filter(u=>u&&u!='NA'&&String(u).trim()!='-').sort();document.getElementById('unitFilters').innerHTML='';unidades.forEach(u=>{let bu=document.createElement('button');bu.className='btn';bu.textContent=u;bu.onclick=()=>{console.log('UNIDADE',u);document.querySelectorAll('#unitFilters .btn').forEach(x=>x.classList.remove('active'));bu.classList.add('active');atualizarCards(rows.filter(x=>x[U]===u));const filtro=document.getElementById('colaboradorFiltro');const gestorFiltro=document.getElementById('gestorFiltro');const dadosUnidade=empArr.filter(x=>x.Unidade===u);const colaboradores=[...new Set(dadosUnidade.map(x=>x.Nome).filter(Boolean))].sort();const gestores=[...new Set(dadosUnidade.map(x=>x.Gestor).filter(Boolean))].sort();gestorFiltro.innerHTML="<option value=''>Todos os gestores</option>";gestores.forEach(gestor=>{let op=document.createElement('option');op.value=gestor;op.textContent=gestor;gestorFiltro.appendChild(op);});filtro.innerHTML="<option value=''>Todos os colaboradores</option>";colaboradores.forEach(nome=>{let op=document.createElement('option');op.value=nome;op.textContent=nome;filtro.appendChild(op);});function renderTabela(){const nome=filtro.value;const gestor=gestorFiltro.value;let dados=empArr.filter(x=>x.Unidade===u);if(gestor)dados=dados.filter(x=>x.Gestor===gestor);if(nome)dados=dados.filter(x=>x.Nome===nome);tb1.innerHTML=dados.sort((a,b)=>{if(a.Intervalo==='-'&&b.Intervalo!=='-')return 1;if(a.Intervalo!=='-'&&b.Intervalo==='-')return -1;if(a.Intervalo==='-'&&b.Intervalo==='-')return 0;return Number(b.Intervalo)-Number(a.Intervalo);}).map(x=>{const semIntervalo=x.Intervalo==='-';const valor=semIntervalo?'-':Math.round(Number(x.Intervalo));let cor=semIntervalo?'#D9D9D9':'#C0E399';if(!semIntervalo){if(valor>=60){cor='#CC00CC';}else if(valor>=45){cor='#FF8181';}else if(valor>=31){cor='#FFFF93';}}return `<tr><td>${x.ID}</td><td>${x.Nome}</td><td>${x.Gestor}</td><td>${x.DataUltimoGSR}</td><td>${x.Modal}</td><td style="background:${cor};font-weight:600;color:#000;">${valor}</td></tr>`;}).join('');}gestorFiltro.onchange=()=>{const gestor=gestorFiltro.value,nomeAtual=filtro.value,colaboradores=[...new Set(empArr.filter(x=>x.Unidade===u&&(!gestor||x.Gestor===gestor)).map(x=>x.Nome).filter(Boolean))].sort();filtro.innerHTML="<option value=''>Todos os colaboradores</option>";colaboradores.forEach(nome=>{let op=document.createElement('option');op.value=nome;op.textContent=nome;filtro.appendChild(op);});if(colaboradores.includes(nomeAtual))filtro.value=nomeAtual;renderTabela();};filtro.onchange=()=>{const nome=filtro.value,gestorAtual=gestorFiltro.value,gestores=[...new Set(empArr.filter(x=>x.Unidade===u&&(!nome||x.Nome===nome)).map(x=>x.Gestor).filter(Boolean))].sort();gestorFiltro.innerHTML="<option value=''>Todos os gestores</option>";gestores.forEach(gestor=>{let op=document.createElement('option');op.value=gestor;op.textContent=gestor;gestorFiltro.appendChild(op);});if(gestores.includes(gestorAtual))gestorFiltro.value=gestorAtual;renderTabela();};renderTabela();};document.getElementById('unitFilters').appendChild(bu);});renderRanking();draw();};document.getElementById('regionalFilters').appendChild(b);});function draw(){tb1.innerHTML='<tr><td colspan="6">Selecione uma Regional e uma Unidade para visualizar os colaboradores.</td></tr>';}renderRanking();atualizarCards(rows,k4.textContent);draw();}</script></body></html>
