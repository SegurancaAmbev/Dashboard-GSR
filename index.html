<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard GSR</title><script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script><style>body{margin:0;background:#ececec;font-family:Segoe UI,sans-serif}.header{background:#121212;color:#fff;padding:28px;text-align:center;border-bottom:6px solid #D4A017}.container{padding:24px;max-width:1500px;margin:auto}.upload{text-align:center;padding:20px}.filebtn{background:#D4A017;border:0;padding:14px 24px;border-radius:25px;font-weight:700;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}.card{background:#121212;border-radius:18px;padding:20px;color:#fff;text-align:center}.num{color:#D4A017;font-size:30px;font-weight:800}.panel{background:#fff;border-radius:18px;padding:20px;margin-top:20px}table{width:100%;border-collapse:collapse}th{background:#121212;color:#fff}th,td{text-align:center;padding:12px}tr:nth-child(even){background:#f7f7f7}.filters{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}.btn{background:#D0D0D0;border:0;padding:10px 16px;border-radius:22px;cursor:pointer}.active{background:#D4A017}.bar{height:16px;background:#ddd;border-radius:10px}.fill{height:100%;background:#D4A017}.gold{background:#D4A01722}.silver{background:#D0D0D055}.bronze{background:#c47a2c22}</style></head><body><div class='header'><h1>Dashboard Executivo GSR</h1><div></div></div><div class='container'><div class='upload'><b>✅ Base carregada automaticamente</b></div><div class='cards'><div class='card'><div>Total GSR</div><div class='num' id='k1'>-</div></div><div class='card'><div>Realizados</div><div class='num' id='k2'>-</div></div><div class='card'><div>Vencidos</div><div class='num' id='k5'>-</div></div><div class='card'><div>Aderência Geral</div><div class='num' id='k3'>-</div></div><div class='card'><div>Top Unidade</div><div class='num' style='font-size:18px' id='k4'>-</div></div></div><div class='panel'><h3>Regional</h3><div class='filters' id='regionalFilters'></div><div id='unitArea' style='display:none;margin-top:20px;'><h3>Unidade</h3><div class='filters' id='unitFilters'></div></div></div><div class='panel'><h2>Colaboradores por Unidade</h2><div style='margin-bottom:15px'><select id='colaboradorFiltro' style='padding:8px;width:300px;border-radius:6px'><option value=''>Todos os colaboradores</option></select></div><table><thead><tr><th>ID</th><th>Nome</th><th>Gestor</th><th>Data Último GSR</th><th>Modal</th><th>Soma Intervalo</th></tr></thead><tbody id='tb1'></tbody></table></div><div class='panel'><h2>Ranking de Aderência</h2><table><thead><tr><th>#</th><th>Unidade</th><th>Realizados</th><th>Total</th><th>% Realizados</th><th>Aderência</th></tr></thead><tbody id='tb2'></tbody></table></div></div><script>const excl=['Com CD Agudos - AS','Com CD Campinas - AS','Com CD Capital - AS','Com CD R. Preto - AS','ComCDD PraiaGrd - AS','ComCDD SJCampos - AS'];Papa.parse('Base GSR Nacional.csv',{download:true,header:true,skipEmptyLines:true,complete:r=>load(r.data)});function load(data){console.log(Object.keys(data[0]));const c=Object.keys(data[0]),REG=c[0],U=c[16],ID=c[2],NM=c[17],INT=c[12],CL=c[13],SP=c[14],MD=c[15],GESTOR='Gestor Corrigido',DATA_GSR='Data Último GSR';const rows=data.filter(x=>!excl.includes(String(x[U]).trim()) && String(x[U]).trim()!='NA' && String(x[U]).trim()!='');const total=rows.length,real=rows.filter(x=>String(x[CL]).toUpperCase().includes('REALIZ')).length,venc=total-real;k1.textContent=total;k2.textContent=real;k3.textContent=Math.round((real/total)*100)+'%';k5.textContent=venc;let emp={},rank={};rows.forEach(r=>{let ek=[r[U],r[ID],r[NM],r[GESTOR],r[DATA_GSR],r[MD]].join('|');emp[ek]=(emp[ek]||0)+(+r[INT]||0);if(!rank[r[U]])rank[r[U]]={Regional:r[REG],Unidade:r[U],Supercom:r[SP],Realizados:0,Total:0};rank[r[U]].Total++;if(String(r[CL]).toUpperCase().includes('REALIZ'))rank[r[U]].Realizados++;});const empArr=Object.entries(emp).map(([k,v])=>{let p=k.split('|');return{Unidade:p[0],ID:p[1],Nome:p[2],Gestor:p[3],DataUltimoGSR:p[4],Modal:p[5],Intervalo:v};});const rk=Object.values(rank).map(x=>({...x,Percentual:+((x.Realizados/x.Total)*100).toFixed(2)})).sort((a,b)=>b.Percentual-a.Percentual||b.Realizados-a.Realizados);k4.textContent=rk[0]?.Unidade||'-';function atualizarCards(dados,topUnidade=null){const total=dados.length;const realizados=dados.filter(x=>String(x[CL]).toUpperCase().includes('REALIZ')).length;const vencidos=total-realizados;const aderencia=total>0?Math.round((realizados/total)*100):0;k1.textContent=total;k2.textContent=realizados;k5.textContent=vencidos;k3.textContent=aderencia+'%';if(topUnidade!==null)k4.textContent=topUnidade;}const regionais=[...new Set(rows.map(x=>x[REG]))].sort();document.getElementById('regionalFilters').innerHTML='';let atual='';regionais.forEach(r=>{let b=document.createElement('button');b.className='btn';b.textContent=r;b.onclick=()=>{atual=r;document.querySelectorAll('#regionalFilters .btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');const dadosRegional=rows.filter(x=>x[REG]===atual);const topRegional=rk.filter(x=>x.Regional===atual)[0]?.Unidade||'-';atualizarCards(dadosRegional,topRegional);document.getElementById('unitArea').style.display='block';const unidades=[...new Set(rows.filter(x=>x[REG]===atual).map(x=>x[U]))].filter(u=>u&&u!='NA').sort();document.getElementById('unitFilters').innerHTML='';unidades.forEach(u=>{let bu=document.createElement('button');bu.className='btn';bu.textContent=u;bu.onclick=()=>{console.log('UNIDADE',u);document.querySelectorAll('#unitFilters .btn').forEach(x=>x.classList.remove('active'));bu.classList.add('active');atualizarCards(rows.filter(x=>x[U]===u));const filtro=document.getElementById('colaboradorFiltro');const colaboradores=[...new Set(empArr.filter(x=>x.Unidade===u).map(x=>x.Nome))].sort();filtro.innerHTML="<option value=''>Todos os colaboradores</option>";colaboradores.forEach(nome=>{let op=document.createElement('option');op.value=nome;op.textContent=nome;filtro.appendChild(op);});function renderTabela(){const nome=filtro.value;let dados=empArr.filter(x=>x.Unidade===u);if(nome)dados=dados.filter(x=>x.Nome===nome);tb1.innerHTML=dados.sort((a,b)=>b.Intervalo-a.Intervalo).map(x=>{const valor=Math.round(x.Intervalo);let cor='#C0E399';if(valor>=60){cor='#CC00CC';}else if(valor>=45){cor='#FF8181';}else if(valor>=31){cor='#FFFF93';}return `<tr><td>${x.ID}</td><td>${x.Nome}</td><td>${x.Gestor}</td><td>${x.DataUltimoGSR}</td><td>${x.Modal}</td><td style="background:${cor};font-weight:600;color:#000;">${valor}</td></tr>`;}).join('');}filtro.onchange=renderTabela;renderTabela();};document.getElementById('unitFilters').appendChild(bu);});tb2.innerHTML=rk.filter(x=>x.Regional===atual).map((r,i)=>`<tr class='${i===0?'gold':i===1?'silver':i===2?'bronze':''}'><td>${i+1}</td><td>${r.Unidade}</td><td>${r.Realizados}</td><td>${r.Total}</td><td>${Math.round(r.Percentual)}%</td><td><div class='bar'><div class='fill' style='width:${r.Percentual}%'></div></div></td></tr>`).join('');draw();};document.getElementById('regionalFilters').appendChild(b);});function draw(){tb1.innerHTML='<tr><td colspan="6">Selecione uma Regional e uma Unidade para visualizar os colaboradores.</td></tr>';}tb2.innerHTML=rk.filter(r=>atual===''||r.Regional===atual).map((r,i)=>`<tr class='${i===0?'gold':i===1?'silver':i===2?'bronze':''}'><td>${i+1}</td><td>${r.Unidade}</td><td>${r.Supercom}</td><td>${r.Realizados}</td><td>${r.Total}</td><td>${Math.round(r.Percentual)}%</td><td><div class='bar'><div class='fill' style='width:${r.Percentual}%'></div></div></td></tr>`).join('');atualizarCards(rows,k4.textContent);draw();}</script></body></html>
