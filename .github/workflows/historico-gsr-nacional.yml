name: Atualizar Historico GSR Nacional

on:
  push:
    branches:
      - main
    paths:
      - 'Nacional/Base GSR Nacional.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-historico:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Gerar fotografia do GSR
        env:
          TZ: America/Sao_Paulo
        run: |
          python3 <<'PY'
          import csv
          import os
          from datetime import datetime, timedelta

          BASE = "Nacional/Base GSR Nacional.csv"
          HISTORICO = "Nacional/Historico GSR.csv"

          EXCLUIDAS = {
              "Com CD Agudos - AS",
              "Com CD Campinas - AS",
              "Com CD Capital - AS",
              "Com CD R. Preto - AS",
              "ComCDD PraiaGrd - AS",
              "ComCDD SJCampos - AS",
              "NA",
              ""
          }

          with open(BASE, "r", encoding="utf-8-sig", newline="") as f:
              amostra = f.read(4096)
              f.seek(0)

              try:
                  dialecto = csv.Sniffer().sniff(amostra, delimiters=",;")
                  leitor = csv.reader(f, dialect=dialecto)
              except csv.Error:
                  leitor = csv.reader(f, delimiter=",")

              linhas = list(leitor)

          if not linhas:
              raise SystemExit("A Base GSR Nacional.csv esta vazia.")

          cabecalho = linhas[0]
          dados = linhas[1:]

          if len(cabecalho) <= 16:
              raise SystemExit("A base nao possui a quantidade esperada de colunas.")

          REG = 0
          ID = 2
          CL = 13
          U = 16
          NM = 17
          IDS_EXCLUIDOS = {'99847913','99845896','99838187'}
          GESTOR = cabecalho.index("Gestor Corrigido")
          DATA_GSR = cabecalho.index("Data Último GSR")
          DATA_CORTE = datetime(2026,6,1)
          ids_unicos = {}
          ranking = {}

          for linha in dados:
              if len(linha) <= max(REG, ID, CL, U, NM, GESTOR, DATA_GSR): 
                  continue
                  
              regional = linha[REG].strip()
              unidade = linha[U].strip()
              id_colaborador = linha[ID].strip()
              nome = linha[NM].strip()
              gestor = linha[GESTOR].strip()
              data_txt = linha[DATA_GSR].strip()
              
              if not id_colaborador or id_colaborador in IDS_EXCLUIDOS or unidade in EXCLUIDAS or unidade == "-" or not regional or regional == "-" or regional == "NA" or not nome or nome == "-" or not gestor or gestor == "0": 
                  continue
                  
              try:
                  if "/" in data_txt[:10]:
                      data_gsr = datetime.strptime(data_txt[:10], "%d/%m/%Y")
                  else:
                      data_gsr = datetime.strptime(data_txt[:10], "%Y-%m-%d")
              except (ValueError, TypeError):
                  continue

              if data_gsr < DATA_CORTE:
                  continue           
              
              existente = ids_unicos.get(id_colaborador)
              if existente is None or data_gsr > existente[0]:
                  ids_unicos[id_colaborador] = (data_gsr, linha)

          for data_gsr, linha in ids_unicos.values(): 
              regional = linha[REG].strip()
              unidade = linha[U].strip()
              classificacao = linha[CL].strip().upper()
                  
              if not classificacao or classificacao == "-":
                  continue
                  
              chave = (regional, unidade)
              
              if chave not in ranking: 
                  ranking[chave] = {
                      "Realizados": 0, 
                      "Total": 0
                  }
                  
              ranking[chave]["Total"] += 1
              
              if "REALIZ" in classificacao: 
                  ranking[chave]["Realizados"] += 1                  
                          
          hoje_data = datetime.now()
          hoje = hoje_data.strftime("%Y-%m-%d")
          
          ultimo_dia_mes_anterior = hoje_data.replace(day=1) - timedelta(days=1)
          data_fechamento = ultimo_dia_mes_anterior.strftime("%Y-%m-%d")

          mes_anterior = ultimo_dia_mes_anterior.strftime("%Y-%m")

          registros_antigos = []
          fechamento_ja_existe = False

          if os.path.exists(HISTORICO):
              with open(HISTORICO, "r", encoding="utf-8-sig", newline="") as f:
                  leitor = csv.DictReader(f)
                  for linha in leitor:
                      data_linha = str(linha.get("Data",""))
                      if data_linha.startswith(mes_anterior):
                          fechamento_ja_existe = True
                      registros_antigos.append(linha)
                          
          if fechamento_ja_existe: raise SystemExit("Fechamento do mês anterior já registrado."); novos = []

          for (regional, unidade), valores in sorted(ranking.items()):
              realizados = valores["Realizados"]
              total = valores["Total"]
              percentual = round((realizados / total) * 100, 2) if total else 0

              novos.append({
                  "Data": data_fechamento,
                  "Regional": regional,
                  "Unidade": unidade,
                  "Realizados": realizados,
                  "Total": total,
                  "Percentual": percentual
              })

          campos = [
              "Data",
              "Regional",
              "Unidade",
              "Realizados",
              "Total",
              "Percentual"
          ]

          with open(HISTORICO, "w", encoding="utf-8-sig", newline="") as f:
              escritor = csv.DictWriter(f, fieldnames=campos)
              escritor.writeheader()
              escritor.writerows(registros_antigos)
              escritor.writerows(novos)

          for item in novos:
              if item["Regional"].strip().lower() == "geo sp" and item["Unidade"].strip().lower() == "capital":
                 print("TESTE CAPITAL:", item) 
                 
          print(f"Fotografia de {hoje} criada com sucesso.")
          print(f"Unidades registradas: {len(novos)}")
          PY

      - name: Salvar historico no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Nacional/Historico GSR.csv"

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao no historico."
          else
            git commit -m "Atualizar historico diario GSR"
            git push
          fi
